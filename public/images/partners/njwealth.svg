<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- NJ Wealth Official Brand Identity Emblem -->
  <!-- Official Crimson Red Plaque -->
  <rect width="100" height="100" rx="14" fill="#ED1C24" />

  <!-- "BUILT ON TRUST" Tagline -->
  <text
    x="50"
    y="16"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="7.5"
    font-weight="800"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="0.8">BUILT ON TRUST</text>

  <!-- Crisp White Center Frame for the Official "Nj" Mark -->
  <rect x="14" y="21" width="72" height="49" rx="3" fill="#FFFFFF" />

  <!-- 1. Stylized Letter 'N' - Left Wing (Vivid Azure Blue) -->
  <path
    d="M 17 24.5 L 30 24.5 L 56 66.5 L 17 66.5 Z"
    fill="#017BC9" />

  <!-- 2. Stylized Letter 'N' - Right Wing (Solid Black) -->
  <path
    d="M 39 24.5 L 57.5 24.5 L 57.5 61.5 Z"
    fill="#111111" />

  <!-- 3. Red Field for Lowercase 'j' -->
  <rect x="61" y="24.5" width="22" height="42" rx="2" fill="#ED1C24" />

  <!-- 4. Lowercase 'j' - White Circular Dot -->
  <circle cx="72" cy="31" r="3.4" fill="#FFFFFF" />

  <!-- 5. Lowercase 'j' - White Curved Stem -->
  <path
    d="M 69.5 37 L 74.5 37 L 74.5 54.5 C 74.5 59 72 62.5 67 62.5 C 64.8 62.5 63.2 61.5 62.5 60.5 C 64 59.8 65.5 58.5 66.2 56.8 C 67.2 54.5 67.5 52 67.5 49 L 69.5 49 Z"
    fill="#FFFFFF" />

  <!-- "WEALTH" Brand Wordmark -->
  <text
    x="50"
    y="89"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="14.5"
    font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="2.5">WEALTH</text>
</svg>
