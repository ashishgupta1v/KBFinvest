<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 126" width="100%" height="100%" fill="none" class="kb-finvest-logo">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="kbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4D7"/>
      <stop offset="25%" stop-color="#F1D793"/>
      <stop offset="55%" stop-color="#D4A537"/>
      <stop offset="100%" stop-color="#9C7420"/>
    </linearGradient>

    <linearGradient id="kbGoldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5972D"/>
      <stop offset="40%" stop-color="#EFD08A"/>
      <stop offset="100%" stop-color="#9C7420"/>
    </linearGradient>

    <!-- Blue Bar Gradients -->
    <linearGradient id="kbBlueBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143663"/>
      <stop offset="45%" stop-color="#255D9E"/>
      <stop offset="100%" stop-color="#122F55"/>
    </linearGradient>

    <linearGradient id="kbBlueBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#194B87"/>
      <stop offset="45%" stop-color="#3275C6"/>
      <stop offset="100%" stop-color="#153B6A"/>
    </linearGradient>

    <linearGradient id="kbBlueBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F5FA8"/>
      <stop offset="45%" stop-color="#3B8BEA"/>
      <stop offset="100%" stop-color="#194B87"/>
    </linearGradient>

    <!-- Arrow Dimensional Gradients -->
    <linearGradient id="kbArrowBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88B27"/>
      <stop offset="35%" stop-color="#F5DE9B"/>
      <stop offset="70%" stop-color="#D4A537"/>
      <stop offset="100%" stop-color="#EBC467"/>
    </linearGradient>

    <linearGradient id="kbArrowSpine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="40%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#FFF2CC"/>
    </linearGradient>

    <linearGradient id="kbArrowShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1F05"/>
      <stop offset="100%" stop-color="#6B4D0D"/>
    </linearGradient>

    <linearGradient id="kbRuleGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A537" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4A537" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D4A537"/>
    </linearGradient>

    <linearGradient id="kbRuleGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A537"/>
      <stop offset="50%" stop-color="#D4A537" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D4A537" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .kb-logo-globe {
      stroke: #2D63A5;
      stroke-opacity: 0.55;
      fill: none;
    }
    .kb-logo-text-kb {
      fill: var(--kb-text, #FFFFFF);
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .kb-logo-text-finvest {
      fill: url(#kbGoldGrad);
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .kb-logo-tagline {
      fill: var(--kb-body, #CBD6E8);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }
    :root[data-theme="light"] .kb-logo-globe,
    html[data-theme="light"] .kb-logo-globe {
      stroke: #1E3A8A;
      stroke-opacity: 0.35;
    }
    :root[data-theme="light"] .kb-logo-text-kb,
    html[data-theme="light"] .kb-logo-text-kb {
      fill: #0A1526;
    }
    :root[data-theme="light"] .kb-logo-tagline,
    html[data-theme="light"] .kb-logo-tagline {
      fill: #475569;
    }
  </style>

  <!-- ================= GROUP 1: GLOBE WIREFRAME ================= -->
  <g class="kb-logo-globe" stroke-width="1.3">
    <!-- Globe Outer Arch / Hemisphere -->
    <path d="M 100 35 A 34 34 0 0 1 168 35" />
    <path d="M 103 26 A 34 34 0 0 1 165 26" stroke-width="1" stroke-opacity="0.35" />
    <!-- Longitudinal Meridians -->
    <path d="M 134 1 A 34 34 0 0 0 134 35" />
    <path d="M 116 11 C 122 17, 126 26, 126 35" stroke-width="1.1" />
    <path d="M 152 11 C 146 17, 142 26, 142 35" stroke-width="1.1" />
    <path d="M 108 22 C 114 26, 118 31, 119 35" stroke-width="0.9" stroke-opacity="0.4" />
    <path d="M 160 22 C 154 26, 150 31, 149 35" stroke-width="0.9" stroke-opacity="0.4" />
    <!-- Latitudinal Parallels -->
    <path d="M 107 19 Q 134 26 161 19" stroke-width="1.1" />
    <path d="M 115 10 Q 134 16 153 10" stroke-width="0.9" stroke-opacity="0.45" />
  </g>

  <!-- ================= GROUP 2: BAR CHART ================= -->
  <g id="kb-bars">
    <!-- Bar 1: Gold (Shortest) -->
    <rect x="11" y="78" width="18" height="32" rx="1.5" fill="url(#kbGoldBar)" stroke="#5E430B" stroke-width="0.8" />
    <line x1="12" y1="80" x2="12" y2="108" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />

    <!-- Bar 2: Deep Blue (Medium-Low) -->
    <rect x="31" y="58" width="18" height="52" rx="1.5" fill="url(#kbBlueBar1)" stroke="#091A33" stroke-width="0.8" />
    <line x1="32" y1="60" x2="32" y2="108" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" />

    <!-- Bar 3: Royal Blue (Medium-High) -->
    <rect x="51" y="42" width="18" height="68" rx="1.5" fill="url(#kbBlueBar2)" stroke="#0A203F" stroke-width="0.8" />
    <line x1="52" y1="44" x2="52" y2="108" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />

    <!-- Bar 4: Bright Cobalt (Tallest) -->
    <rect x="71" y="32" width="18" height="78" rx="1.5" fill="url(#kbBlueBar3)" stroke="#0C2548" stroke-width="0.8" />
    <line x1="72" y1="34" x2="72" y2="108" stroke="rgba(255,255,255,0.45)" stroke-width="0.8" />
  </g>

  <!-- ================= GROUP 3: SWOOSH & UPWARD ARROW ================= -->
  <g id="kb-arrow">
    <!-- Dark Under-Bevel / Drop Edge -->
    <path d="M 0 110 C 15 106, 38 88, 64 63 C 82 45, 96 28, 107 15 L 105 23 C 94 36, 80 52, 62 70 C 37 94, 15 110, 0 114 Z" fill="url(#kbArrowShadow)" opacity="0.85" />
    
    <!-- Main Gold Swoosh Body -->
    <path d="M 1 109 C 18 104, 40 85, 66 61 C 84 43, 98 26, 108 14 L 100 21 C 81 40, 64 58, 43 78 C 24 96, 11 105, 1 109 Z" fill="url(#kbArrowBody)" />
    
    <!-- Spine Highlight -->
    <path d="M 2 108 C 20 102, 42 84, 67 60 C 85 42, 99 25, 108 14" stroke="url(#kbArrowSpine)" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Arrow Head -->
    <polygon points="107,7 119,16 112,18 116,29 110,30 107,19 100,22" fill="#8C6314" />
    <polygon points="106,6 117,14 111,16 114,27 109,28 106,17 100,20" fill="url(#kbGoldGrad)" stroke="#FFE8A3" stroke-width="0.6" />
    <polygon points="106,6 117,14 111,16 106,6" fill="#FFF4D2" opacity="0.6" />
  </g>

  <!-- ================= GROUP 4: WORDMARK "KB Finvest" ================= -->
  <!-- "KB" Serif Wordmark -->
  <text x="96" y="88" class="kb-logo-text-kb" font-size="62">KB</text>

  <!-- "Finvest" Italic Script Wordmark -->
  <text x="180" y="87" class="kb-logo-text-finvest" font-size="56">Finvest</text>

  <!-- ================= GROUP 5: TAGLINE & DIVIDERS ================= -->
  <!-- Left Tapered Rule -->
  <path d="M 8 113 L 64 113" stroke="url(#kbRuleGradLeft)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="65" cy="113" r="1.2" fill="#D4A537" />

  <!-- Slogan / Tagline -->
  <text x="69" y="116" class="kb-logo-tagline">INVEST SMART. GROW SECURE.</text>

  <!-- Right Tapered Rule -->
  <circle cx="282" cy="113" r="1.2" fill="#D4A537" />
  <path d="M 283 113 L 348 113" stroke="url(#kbRuleGradRight)" stroke-width="1.8" stroke-linecap="round" />
</svg>
